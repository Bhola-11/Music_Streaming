{% extends 'base.html' %}

{% block title %}Delete {{ object.title }} — MusicVerse{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 60px auto;">
  <div class="glass-panel" style="text-align: center; padding: 40px;">
    <div style="font-size: 3rem; margin-bottom: 16px;">🗑️</div>
    <h2 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 12px;">Delete Playlist?</h2>
    <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 24px;">
      Are you sure you want to delete <strong>"{{ object.title }}"</strong>? This action cannot be undone.
    </p>

    <form method="POST">
      {% csrf_token %}
      <div style="display: flex; gap: 16px; justify-content: center;">
        <button type="submit" class="btn btn-primary" style="background: #ff4757; border-color: #ff4757;">Permanently Delete</button>
        <a href="{% url 'playlists:detail' object.slug %}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
