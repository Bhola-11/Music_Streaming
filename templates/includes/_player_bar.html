<!-- Persistent Audio Player Container -->
<div id="musicverse-player-bar" class="player-bar">
  <div class="player-track-info">
    <img id="player-track-cover" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=120&auto=format&fit=crop&q=80" alt="Track Cover" class="player-cover-art">
    <div class="player-track-meta">
      <h4 id="player-track-title">Select a Track to Play</h4>
      <p id="player-track-artist">MusicVerse Stream</p>
    </div>
    <button id="player-btn-like" class="player-ctrl-btn" title="Save to Favorites" style="margin-left: 8px;">🤍</button>
  </div>

  <div class="player-controls-center">
    <div class="player-buttons">
      <button id="player-btn-shuffle" class="player-ctrl-btn" title="Shuffle">🔀</button>
      <button id="player-btn-prev" class="player-ctrl-btn" title="Previous Track">⏮</button>
      <button id="player-btn-play" class="play-btn-master" title="Play/Pause">▶</button>
      <button id="player-btn-next" class="player-ctrl-btn" title="Next Track">⏭</button>
      <button id="player-btn-repeat" class="player-ctrl-btn" title="Repeat">🔁</button>
    </div>

    <div class="player-progress-bar-container">
      <span id="player-current-time" class="time-stamp">0:00</span>
      <input type="range" id="player-seek-slider" class="seek-bar" min="0" max="100" value="0">
      <span id="player-total-time" class="time-stamp">0:00</span>
    </div>
  </div>

  <div class="player-options-right">
    <button id="player-btn-visualizer-toggle" class="player-ctrl-btn" title="3D Visualizer Mode">🌌</button>
    <button id="player-btn-queue" class="player-ctrl-btn" title="Playing Queue">📑</button>
    <div style="display: flex; align-items: center; gap: 8px; width: 120px;">
      <span style="font-size: 0.9rem; color: var(--text-dim);">🔊</span>
      <input type="range" id="player-volume-slider" class="seek-bar" min="0" max="100" value="85">
    </div>
  </div>
</div>
