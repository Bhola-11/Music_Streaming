<header class="top-navbar">
  <form action="{% url 'discovery:search' %}" method="GET" class="search-bar-container">
    <span class="search-icon">🔍</span>
    <input type="text" name="q" value="{{ request.GET.q|default:'' }}" class="search-input" placeholder="Search songs, artists, albums, or playlists...">
  </form>

  <div class="nav-user-actions">
    {% if user.is_authenticated %}
      <a href="{% url 'notifications:list' %}" style="position: relative; color: var(--text-muted); text-decoration: none; font-size: 1.2rem;">
        🔔
        {% if UNREAD_NOTIFICATIONS_COUNT > 0 %}
        <span style="position: absolute; top: -6px; right: -6px; background: var(--accent-pink); color: white; border-radius: 50%; font-size: 0.65rem; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; font-weight: bold;">
          {{ UNREAD_NOTIFICATIONS_COUNT }}
        </span>
        {% endif %}
      </a>

      <div style="position: relative; display: inline-block;">
        <a href="{% url 'accounts:profile' user.username %}" class="user-avatar-pill">
          <img src="{{ user.avatar_url }}" alt="{{ user.username }}" class="user-avatar-img">
          <span style="font-size: 0.9rem; font-weight: 600;">{{ user.username }}</span>
          {% if user.is_premium %}
          <span class="badge badge-premium" style="font-size: 0.65rem; padding: 2px 6px;">PRO</span>
          {% endif %}
        </a>
      </div>

      <a href="{% url 'accounts:preferences' %}" title="Settings" style="color: var(--text-muted); font-size: 1.2rem; text-decoration: none;">⚙️</a>
      <a href="{% url 'accounts:logout' %}" title="Sign Out" style="color: var(--text-dim); font-size: 1.1rem; text-decoration: none;">🚪</a>
    {% else %}
      <a href="{% url 'accounts:login' %}" class="btn btn-secondary btn-sm">Sign In</a>
      <a href="{% url 'accounts:register' %}" class="btn btn-primary btn-sm">Join MusicVerse</a>
    {% endif %}
  </div>
</header>
